[project]
name = "hermes-soul-android"
version = "1.0.0"
description = "Hermes Soul - Lightweight Android GUI Agent with OpenRouter"
authors = [{name = "Soul"}]
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0.4",
]

[tool.flet]
org = "com.hermes.soul"
product = "HermesSoul"
company = "Hermes Agent"
copyright = "2026 Soul"

# Entry point is main.py in the project root.
# Do not set app.path to a file — Flet treats it as a directory.
[tool.flet.app]
module = "main"
